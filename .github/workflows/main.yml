name: Golden DevSecOps - Azure Terraform

on:
  push:
    branches:
      - feature/dev
      - main

  pull_request:
    branches:
      - feature/dev
      - main

  workflow_dispatch:

# ============================================================
# GLOBAL CONFIG
# ============================================================

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  TF_VERSION: "1.14.6"
  TF_DIR: "./infra"

# ============================================================
# 1. PARALLEL SECURITY SCANS
# ============================================================

jobs:

  sonar:
    name: SAST | SonarQube
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  gitleaks:
    name: Secret Scan | Gitleaks
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  trivy:
    name: Vulnerability Scan | Trivy
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1


  checkov:
    name: IaC Security | Checkov
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ env.TF_DIR }}
          framework: terraform
          soft_fail: false


  tflint:
    name: Terraform Lint | TFLint
    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        shell: powershell
        working-directory: ${{ env.TF_DIR }}
        run: |
          tflint --init
          tflint --format compact


# ============================================================
# 2. SECURITY GATE + TERRAFORM VALIDATION
# ============================================================

  validate:
    name: Security Gate + Terraform Validate

    needs:
      - sonar
      - gitleaks
      - trivy
      - checkov
      - tflint

    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        shell: powershell
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -backend=false

      - name: Terraform Validate
        shell: powershell
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform validate


# ============================================================
# 3. AZURE OIDC + TERRAFORM PLAN
# ============================================================

  plan:
    name: Azure OIDC + Terraform Plan

    needs: validate

    runs-on: [self-hosted, Windows]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -------------------------
      # Azure OIDC
      # -------------------------

      - name: Azure Login - Federated Credentials
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Authentication
        shell: powershell
        run: |
          Write-Host "Checking Azure authentication..."

          az account show `
            --query "{Subscription:id, Tenant:tenantId, Name:name}" `
            --output table

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Azure authentication failed."
            exit 1
          }

          Write-Host "Azure authentication successful."

      # -------------------------
      # Terraform
      # -------------------------

      - name: Terraform Init
        shell: powershell
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init

      - name: Terraform Plan
        shell: powershell
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -out=tfplan

      - name: Generate Plan Report
        shell: powershell
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform show -no-color tfplan > tfplan.txt

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.run_number }}
          path: |
            ${{ env.TF_DIR }}/tfplan
            ${{ env.TF_DIR }}/tfplan.txt
          retention-days: 7


# ============================================================
# 4. PRODUCTION APPROVAL + APPLY
# ============================================================

  apply:
    name: Manual Approval + Terraform Apply

    needs: plan

    if: github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Windows]

    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download Approved Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ github.run_number }}
          path: ${{ env.TF_DIR }}

      - name: Azure Login - Federated Credentials
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        shell: powershell
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init

      - name: Terraform Apply
        shell: powershell
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform apply -auto-approve tfplan
